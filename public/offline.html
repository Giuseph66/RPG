<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>RPG Companion — offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(34rem, 100%); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { color: #d1d5db; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <h1 id="offline-title">Você está offline</h1>
      <p>O RPG Companion não conseguiu abrir esta página agora. Volte quando a conexão estiver disponível; seus dados locais permanecem preservados.</p>
    </main>
  </body>
</html>
